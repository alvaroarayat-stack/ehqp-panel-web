<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b4e"><title>Panel Estratégico EHQP</title><link rel="apple-touch-icon" sizes="180x180" href="icon.jpg?v=2"><link rel="icon" href="icon.jpg?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EHQP Estratégico"><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f2f5fa;color:#172b45}header{background:#102b4e;color:white;padding:22px 18px}h1{font-size:23px;margin:0}header p{margin:6px 0 0;color:#cbd9e9}nav{display:flex;overflow:auto;background:white;border-bottom:1px solid #ddd}nav button{border:0;background:white;padding:16px;white-space:nowrap;color:#16385a;font-weight:650}nav button.active{border-bottom:3px solid #0b77cb}main{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:12px;padding:18px;margin:0 0 15px;box-shadow:0 2px 9px #122c4512}h2{margin-top:0}input,textarea,select{display:block;width:100%;padding:12px;margin:8px 0 13px;border:1px solid #b9c6d4;border-radius:8px;font:inherit}button.primary{background:#1269ac;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:bold}button.delete{border:0;background:#fbe8e8;color:#a02020;padding:8px;border-radius:7px}small{color:#576879}.row{border-top:1px solid #e5e9ef;padding:12px 0;white-space:pre-wrap}.muted{color:#64748b}</style></head><body><header><h1>Panel de Inteligencia Estratégica EHQP</h1><p>Tips · Contactos · Reuniones · Oportunidades</p></header><nav id="nav"></nav><main id="main"></main><script>
const types={tips:['Título','Comentario','Fuente / contacto'],contactos:['Nombre','Empresa','Cargo','Teléfono','Email','Foto (URL)','Notas / seguimiento'],reuniones:['Asunto','Fecha','Participantes','Compromisos'],oportunidades:['Oportunidad','Empresa','Estado','Próxima acción']};
let tab='inicio';let db;try{db=JSON.parse(localStorage.getItem('ehqp_panel_v1'))||{}}catch(e){db={}};for(const t of Object.keys(types))db[t]??=[];
const contactosIniciales=[
['Carolina Rojas Gatica','Accresca','Por confirmar','','crojas@accresca.com','','Reunión EHQP 22-10-2026. Consejo: innovación minera debe tener alto impacto positivo y riesgo/interferencia operacional mínimos. Explorar vías de validación y ChileGlobal Ventures. Email alternativo: carolina.rojasga@gmail.com.'],
['Santiago Marín Cruchaga','CORFO','Relaciones Corporativas','','santiago.marin@corfo.cl','','Conversaciones sobre EHQP y socio estratégico para financiar prototipo industrial. Seguimiento: colaboración y contactos.'],
['Fernando Hentzschel Martínez','CORFO','Gerente de Capacidades Tecnológicas','','fhentzschel@corfo.cl','','Contacto para centros tecnológicos, CNP y ecosistema de innovación minera.'],
['Jorge Bravo','APRIMIN','Por confirmar','','','','Contacto realizado el 22-10-2026 para solicitar orientación y reunión con Comité de Innovación APRIMIN.'],
['Juan Pablo Silva','DF MAS','Por confirmar','','','','Confirmó recepción de postulación EHQP a Mining MASPitch 2026.'],
['Sebastián Acevedo','Por confirmar','Por confirmar','','','','Contacto potencial por LinkedIn: solicitar reunión de 20 minutos para presentar EHQP e interés de colaboración.'],
['George','Longi Sudamérica','Por confirmar','','','','Reunión 22-09-2026: separación magnética, laboratorio en Chile, presentación de maqueta EHQP y posible colaboración. Apellido pendiente.'],
['Fernando Parra','Longi Chile','Por confirmar','','','','Participó en reunión Longi del 22-09-2026.'],
['Danilo Muñoz','Por confirmar','Por confirmar','','','','Participó en reunión Longi del 22-09-2026.'],
['Camilo Mejías','Por confirmar','Por confirmar','','','','Posible colaboración en estudio CFD de EHQP y publicación técnica. Relacionado con AMSA.'],
['Juan Castiglione','Castiglione y Cía','Especialista hidráulico','+56965241696','','','Conversaciones técnicas sobre contaminación hidráulica, durabilidad, obsolescencia y costos.'],
['Catalina Díaz Vásquez','Castiglione Cía SpA','Coordinadora de Proyectos','','','','Contacto relacionado con tecnología minera patentada, ahorro, eficiencia y seguridad.'],
];
function cargarContactos(){let existing=new Set(db.contactos.map(r=>(r[0]||'').toLowerCase().trim()));let added=0;for(const c of contactosIniciales){if(!existing.has(c[0].toLowerCase())){db.contactos.push(c);added++}}if(added)save();return added}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('ehqp_panel_v1',JSON.stringify(db))}
function openTab(t){tab=t;render()}
function editar(i){let r=db[tab][i];let f=types[tab];let nuevo=f.map((label,j)=>prompt(label,r[j]||''));if(nuevo.some(v=>v===null))return;db[tab][i]=nuevo.map(v=>v.trim());save();render()}
function render(){nav.innerHTML=[['inicio','Inicio'],['tips','💡 Tips'],['contactos','👥 Contactos'],['reuniones','📅 Reuniones'],['oportunidades','🎯 Oportunidades'],['respaldo','Respaldo']].map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="openTab(\''+k+'\')">'+v+'</button>').join('');
if(tab==='inicio'){main.innerHTML='<section class="card"><h2>Bienvenido</h2><p>Registra ideas estratégicas, contactos, reuniones y oportunidades desde este dispositivo.</p><p><strong>Versión inicial:</strong> los datos se guardan solo en este navegador. No hay sincronización ni conexión a Gmail todavía.</p></section>'+Object.keys(types).map(t=>'<section class="card"><strong>'+t.toUpperCase()+'</strong>: '+db[t].length+' registros</section>').join('');return}
if(tab==='respaldo'){main.innerHTML='<section class="card"><h2>Respaldo de datos</h2><p>Guarda una copia para no perder los registros de este dispositivo.</p><button class="primary" onclick="backup()">Exportar respaldo JSON</button><p>Importar respaldo:</p><input type="file" accept=".json,application/json" onchange="restore(event)"></section>';return}
let fields=types[tab];main.innerHTML='<section class="card"><h2>'+tab[0].toUpperCase()+tab.slice(1)+'</h2><form id="form">'+fields.map((f,i)=>'<label>'+esc(f)+'<input name="f'+i+'" '+(i===0?'required':'')+'></label>').join('')+'<button class="primary">Agregar registro</button></form></section><section class="card"><h2>Registros ('+db[tab].length+')</h2><input id="search" placeholder="Buscar..." oninput="list()"><div id="items"></div></section>';document.getElementById('form').onsubmit=e=>{e.preventDefault();db[tab].unshift(fields.map((_,i)=>e.target['f'+i].value.trim()));save();render()};list()}
function list(){let q=(document.getElementById('search')?.value||'').toLowerCase();document.getElementById('items').innerHTML=db[tab].map((r,i)=>({r,i})).filter(({r})=>r.join(' ').toLowerCase().includes(q)).map(({r,i})=>'<div class="row">'+r.map((v,j)=>'<div><strong>'+esc(types[tab][j])+':</strong> '+esc(v)+'</div>').join('')+'<button class="delete" onclick="removeItem('+i+')">Eliminar</button></div>').join('')||'<p class="muted">Sin registros.</p>'}
function removeItem(i){if(confirm('¿Eliminar este registro?')){db[tab].splice(i,1);save();render()}}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='respaldo-ehqp.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(e){try{let obj=JSON.parse(await e.target.files[0].text());if(!Object.keys(types).every(t=>Array.isArray(obj[t])))throw Error('Formato no válido');if(confirm('¿Reemplazar todos los registros locales por el respaldo?')){db=obj;save();render()}}catch(err){alert('No se pudo importar: '+err.message)}}
cargarContactos();render();</script></body></html>
